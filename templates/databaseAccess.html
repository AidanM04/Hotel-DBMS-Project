    <div class="container">
        <h2>Select a CRUD functionality</h2>

            </select>

            <!-- Create Menu -->
            <!-- add onchange function to update subMenusName variable -->
            <div id="post_menu" class="hidden">
                <h3>Table Selection (Create)</h3>
                <select name="create_table">
                    <option value="">-- Select an Option --</option>
                    <option value="Guest_Cr">Guest Table</option>
                    <option value="Room_Cr">Room Table</option>
                    <option value="Booking_Cr">Booking Table</option>
                    <option value="Payment_Cr">Payment Table</option>
                    <option value="Services_Cr">Services Table</option>
                    <option value="Reviews_Cr">Reviews Table</option>
                    <option value="Booking_Services_Cr">Booking Services Table</option>
                </select>
            </div>

            <!-- Read Menu -->
            <!-- add onchange function to update subMenusName variable -->
            <div id="get_menu" class="hidden">
                <h3>Table Selection (Read)</h3>
                <select name="read_table" >
                    <option value="">-- Select an Option --</option>
                    <option value="Guest_Re">Guest Table</option>
                    <option value="Room_Re">Room Table</option>
                    <option value="Booking_Re">Booking Table</option>
                    <option value="Payment_Re">Payment Table</option>
                    <option value="Services_Re">Services Table</option>
                    <option value="Reviews_Re">Reviews Table</option>
                    <option value="Booking_Services_Re">Booking Services Table</option>
                </select>
            </div>

            <!-- Update Menu -->
            <div id="put_menu" class="hidden">
                <h3>Table Selection (Update)</h3>
                <select id="table_select_put" name="update_table" onchange="showSubSubMenu('put')">
                    <option value="">-- Select an Option --</option>
                    <option value="Guest_Up">Guest Table</option>
                    <option value="Room_Up">Room Table</option>
                    <option value="Booking_Up">Booking Table</option>
                </select>
                <div id="Guest_Up" class="hidden">
                    <h4>Guest ID</h4>
                    <input type="text" id="guest_id" name="guest_id" style="width: 200px;">
                </div>
                <div id="Room_Up" class="hidden">
                    <h4>Room ID</h4>
                    <input type="text" id="room_id" name="room_id" style="width: 200px;">
                </div>
                <div id="Booking_Up" class="hidden">
                    <h4>Booking ID</h4>
                    <input type="text" id="booking_id" name="booking_id" style="width: 200px;">
                </div>
            </div>

            <!-- Delete Menu -->
            <div id="delete_menu" class="hidden">
                <h3>Table Selection (Delete)</h3>
                <select id="table_select_delete" name="delete_table" onchange="showSubSubMenu('delete')">
                    <option value="">-- Select an Option --</option>
                    <option value="Guest_Del">Guest Table</option>
                    <option value="Room_Del">Room Table</option>
                    <option value="Booking_Del">Booking Table</option>
                </select>
                <div id="Guest_Del" class="hidden">
                    <h4>Guest ID</h4>
                    <input type="text" id="guest_id" name="guest_id" style="width: 200px;">
                </div>
                <div id="Room_Del" class="hidden">
                    <h4>Room ID</h4>
                    <input type="text" id="room_id" name="room_id" style="width: 200px;">
                </div>
                <div id="Booking_Del" class="hidden">
                    <h4>Booking ID</h4>
                    <input type="text" id="booking_id" name="booking_id" style="width: 200px;">
                </div>
            </div>

            <!-- Submit Button (will need to add an onclick to send all 3 variables menusName, subMenusName, and somethingId to something for processing (probably send to another page here))-->
            <button type="submit">Submit</button>
        </form>
    </div>

    <script>
        var menusName;
        var subMenusName;
        var somethingID;

        // Create a new function here for updating subMenusName to whatever is selected 

        // Create ANOTHER new function here for updating somthingID to whatever is typed On change of an ID textbox (will involve adding more onchange functions above (maybe in text input fields))

        function showSubMenu() {
            // Hide all main menus
            const menus = document.querySelectorAll('.container > form > div');
            menus.forEach(menu => menu.classList.add('hidden'));

            // Show the selected main menu
            const selectedOption = document.getElementById('mainDropdown').value;
            if (selectedOption) {
                // The single line below comfortably updates the menusName variable to whatever is selected because this function runs whenever the original dropdown changes
                menusName = selectedOption;
                document.getElementById(`${selectedOption}_menu`).classList.remove('hidden');
            }
        }

        function showSubSubMenu(category) {
            // Get all sub-menus under the selected category
            const subMenus = document.querySelectorAll(`#${category}_menu > div`);

            // Hide all sub-menus
            subMenus.forEach(menu => menu.classList.add('hidden'));

            // Get the selected sub-option
            const selectedSubOption = document.getElementById(`table_select_${category}`).value;

            // Show the corresponding sub-menu
            if (selectedSubOption) {
                document.getElementById(selectedSubOption).classList.remove('hidden');
            }
        }
    </script>
</body>
