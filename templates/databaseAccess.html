<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Database Access</title>
    <link href="{{ url_for('static', filename='styles/adminstyle.css')}}" rel="stylesheet" />
</head>
<!--
This page should allow for easy access to the database with several interactive elements,
I may have to make them take you to different pages because I'm not very familiar with html
-->

<body>
    <h1>Hotel DBEE Administrator Database Access</h1>

    <div class="container">
        <h2>Select a CRUD functionality</h2>
        <form id="crudForm" action="/directByInputs" method="get">

            <!-- Hidden inputs for passing JavaScript variables -->
            <input type="hidden" id="menusNameInput" name="menusName">
            <input type="hidden" id="subMenusNameInput" name="subMenusName">
            <input type="hidden" id="somethingIDInput" name="somethingID">

            <select id="mainDropdown" name="crud_functionality" onchange="showSubMenu()">
                <option value="">-- Select an Option --</option>
                <option value="post">Create</option>
                <option value="get">Read</option>
                <option value="put">Update</option>
                <option value="delete">Delete</option>
            </select>

            <!-- Create Menu -->
            <div id="post_menu" class="hidden">
                <h3>Table Selection (Create)</h3>
                <select id="table_select_post" name="create_table" onchange="updateTableSelection('post')">
                    <option value="">-- Select an Option --</option>
                    <option value="Guest_Cr">Guest Table</option>
                    <option value="Room_Cr">Room Table</option>
                    <option value="Booking_Cr">Booking Table</option>
                    <option value="Payment_Cr">Payment Table</option>
                    <option value="Services_Cr">Services Table</option>
                    <option value="Reviews_Cr">Reviews Table</option>
                    <option value="Booking_Services_Cr">Booking Services Table</option>
                </select>
            </div>

            <!-- Read Menu -->
            <div id="get_menu" class="hidden">
                <h3>Table Selection (Read)</h3>
                <select id="table_select_get" name="read_table" onchange="updateTableSelection('get')">
                    <option value="">-- Select an Option --</option>
                    <option value="Guest_Re">Guest Table</option>
                    <option value="Room_Re">Room Table</option>
                    <option value="Booking_Re">Booking Table</option>
                    <option value="Payment_Re">Payment Table</option>
                    <option value="Services_Re">Services Table</option>
                    <option value="Reviews_Re">Reviews Table</option>
                    <option value="Booking_Services_Re">Booking Services Table</option>
                </select>
            </div>

            <!-- Update Menu -->
            <div id="put_menu" class="hidden">
                <h3>Table Selection (Update)</h3>
                <select id="table_select_put" name="update_table" onchange="showSubSubMenu('put')">
                    <option value="">-- Select an Option --</option>
                    <option value="Guest_Up">Guest Table</option>
                    <option value="Room_Up">Room Table</option>
                    <option value="Booking_Up">Booking Table</option>
                </select>
                <div id="Guest_Up" class="hidden">
                    <h4>Guest ID</h4>
                    <input type="text" id="update_guest_id" name="guest_id" style="width: 200px;" oninput="updateTableID('update_guest')">
                </div>
                <div id="Room_Up" class="hidden">
                    <h4>Room ID</h4>
                    <input type="text" id="update_room_id" name="room_id" style="width: 200px;" oninput="updateTableID('update_room')">
                </div>
                <div id="Booking_Up" class="hidden">
                    <h4>Booking ID</h4>
                    <input type="text" id="update_booking_id" name="booking_id" style="width: 200px;" oninput="updateTableID('update_booking')">
                </div>
            </div>

            <!-- Delete Menu -->
            <div id="delete_menu" class="hidden">
                <h3>Table Selection (Delete)</h3>
                <select id="table_select_delete" name="delete_table" onchange="showSubSubMenu('delete')">
                    <option value="">-- Select an Option --</option>
                    <option value="Guest_Del">Guest Table</option>
                    <option value="Room_Del">Room Table</option>
                    <option value="Booking_Del">Booking Table</option>
                </select>
                <div id="Guest_Del" class="hidden">
                    <h4>Guest ID</h4>
                    <input type="text" id="del_guest_id" name="guest_id" style="width: 200px;" oninput="updateTableID('del_guest')">
                </div>
                <div id="Room_Del" class="hidden">
                    <h4>Room ID</h4>
                    <input type="text" id="del_room_id" name="room_id" style="width: 200px;" oninput="updateTableID('del_room')">
                </div>
                <div id="Booking_Del" class="hidden">
                    <h4>Booking ID</h4>
                    <input type="text" id="del_booking_id" name="booking_id" style="width: 200px;" oninput="updateTableID('del_booking')">
                </div>
            </div>

            <!-- Submit Button (will need to add an onclick to send all 3 variables menusName, subMenusName, and somethingId to something for processing (probably send to another page here))-->
            <button type="submit" onclick="updateFormInputs()">Submit</button>
        </form>
    </div>

    <form action="/index">
        <button type="submit" style="font-size: 1rem;">Return to Homepage </button>
    </form>

    <script>
        var menusName;
        var subMenusName;
        var somethingID;

        // Update hidden inputs before form submission
        function updateFormInputs() {
            document.getElementById("menusNameInput").value = menusName || "";
            document.getElementById("subMenusNameInput").value = subMenusName || "";
            document.getElementById("somethingIDInput").value = somethingID || "";
        }

        // Create a new function here for updating subMenusName to whatever is selected 
        function updateTableSelection(simpleCategory) {
            // Get the selected data table
            const selectedDataTable = document.getElementById(`table_select_${simpleCategory}`).value;

            if (selectedDataTable) {
                subMenusName = selectedDataTable;
                console.log(subMenusName);
            }
        }

        // Create ANOTHER new function here for updating somthingID to whatever is typed On change of an ID textbox (will involve adding more onchange functions above (maybe in text input fields))
        function updateTableID(crudAndCategory) {
            let writtenID = document.getElementById(`${crudAndCategory}_id`).value;
            if (writtenID) {
                somethingID = writtenID;
                console.log(somethingID);
            }
        }

        // Function to show the selected dropdown whenever one is selected
        function showSubMenu() {
            // Hide all main menus
            const menus = document.querySelectorAll('.container > form > div');
            menus.forEach(menu => menu.classList.add('hidden'));

            // Show the selected main menu
            const selectedOption = document.getElementById('mainDropdown').value;
            if (selectedOption) {
                // The single line below comfortably updates the menusName variable to whatever is selected because this function runs whenever the original dropdown changes
                menusName = selectedOption;
                document.getElementById(`${selectedOption}_menu`).classList.remove('hidden');
                console.log(menusName);
            }
        }


        // Function to show selected sub-dropdown whenever one is selected
        function showSubSubMenu(category) {
            // Get all sub-menus under the selected category
            const subMenus = document.querySelectorAll(`#${category}_menu > div`);

            // Hide all sub-menus
            subMenus.forEach(menu => menu.classList.add('hidden'));

            // Get the selected sub-option
            const selectedSubOption = document.getElementById(`table_select_${category}`).value;

            // Show the corresponding sub-menu
            if (selectedSubOption) {
                subMenusName = selectedSubOption;
                document.getElementById(selectedSubOption).classList.remove('hidden');
                console.log(subMenusName);
            }
        }
    </script>
</body>


</html>
