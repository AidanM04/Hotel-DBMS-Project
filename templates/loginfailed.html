<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Failed</title>
    <link href="{{ url_for('static', filename='styles/loginstyle.css')}}" rel="stylesheet" />
</head>
<!--
This page should allow for database administator login retries if they fail an initial login
-->
<body>
    <h1>Admin Login Failed</h1>
    <h2>Try Again?</h2>
    <div class="login-container">
        <form action="/databaseAccess">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="login-button">Login</button>
        </form>
    </div>
    <form action="/index">
        <button type="submit">Return to Homepage </button>
    </form>
</body>
</html>
